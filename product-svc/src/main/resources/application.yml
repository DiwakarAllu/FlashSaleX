spring:
  application:
    name: product-svc
  mongodb:
    uri: "mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin}@localhost:27017/${MONGO_DATABASE:flashsalex-products}?authSource=admin"
  data:
    mongodb:
      auto-index-creation: true
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via_dto

server:
  port: 9000
