spring:
  application:
    name: user-svc
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flashsalex_users}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 9001

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:flashsalex-user-svc}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
