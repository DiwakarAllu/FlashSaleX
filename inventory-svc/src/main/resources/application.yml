server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: inventory-svc
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5434/flashsalex_inventory}
    username: ${INVENTORY_DB_USERNAME:postgres}
    password: ${INVENTORY_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
