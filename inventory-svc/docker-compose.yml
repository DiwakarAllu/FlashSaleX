services:
  postgres:
    image: postgres:17
    container_name: flashsalex-inventory-db
    environment:
      POSTGRES_DB: flashsalex_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inventory_postgres_data:
